<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dfinery CDN MPA product</title>
    <link rel="stylesheet" href="./style.css">
    <script>
      window.__dfnCdnMpaRoute = "product";
      window.__dfnCdnMpaDefaultSdk = "latest";
      window.__dfnCdnMpaDefaultSdkUrl = "";
      window.__dfnCdnMpaDefaultServiceId = "gou080";
      window.__dfnCdnMpaEnvironment = "source";
    </script>
    <script>
      (function (_, e) {
        if (typeof _ === "undefined" || _.Dfinery) return;
        var params = new URLSearchParams(_.location.search);
        var defaultSdk = _.__dfnCdnMpaDefaultSdk || "latest";
        var sdkMode = params.get("sdk") || defaultSdk;
        var defaultSdkUrl = _.__dfnCdnMpaDefaultSdkUrl || "";
        var sdkUrl = params.get("sdkUrl") || defaultSdkUrl || (sdkMode === "dev"
          ? "https://static.dfinery.io/web-sdk/test/dfn-web-sdk.js"
          : "https://static.dfinery.io/web-sdk/latest/dfn-web-sdk.min.js");
        _.__dfnCdnMpaSdkUrl = sdkUrl;
        var dfinery = { queue: [] };
        var scriptEl = e.createElement("script");
        scriptEl.type = "text/javascript";
        scriptEl.async = true;
        scriptEl.src = sdkUrl;
        scriptEl.onload = function () {
          if (_.Dfinery.runQueuedFunctions) _.Dfinery.runQueuedFunctions();
          if (_.__dfnCdnMpaOnSdkLoad) _.__dfnCdnMpaOnSdkLoad();
        };
        var firstScript = e.getElementsByTagName("script")[0];
        firstScript.parentNode.insertBefore(scriptEl, firstScript);
        ["init", "onInitialized", "logEvent", "setUserProfile", "setUserProfiles", "setIdentity", "setIdentities", "resetIdentity", "enableSDK", "disableSDK"].forEach(function (fnName) {
          var parts = fnName.split(".");
          var method = parts.pop();
          parts.reduce(function (target, key) {
            target[key] = target[key] || {};
            return target[key];
          }, dfinery)[method] = function () {
            dfinery.queue.push([fnName, arguments]);
          };
        });
        _.DFEvent = { LOGIN: "df_login", LOGOUT: "df_logout", SIGN_UP: "df_sign_up", PURCHASE: "df_purchase", REFUND: "df_refund", VIEW_HOME: "df_view_home", VIEW_PRODUCT_DETAILS: "df_view_product_details", ADD_TO_CART: "df_add_to_cart", ADD_TO_WISHLIST: "df_add_to_wishlist", VIEW_SEARCH_RESULT: "df_view_search_result", SHARE_PRODUCT: "df_share_product", VIEW_LIST: "df_view_list", VIEW_CART: "df_view_cart", REMOVE_CART: "df_remove_cart", ADD_PAYMENT_INFO: "df_add_payment_info" };
        _.DFEventProperty = { ITEMS: "df_items", ITEM_ID: "df_item_id", ITEM_NAME: "df_item_name", ITEM_PRICE: "df_price", ITEM_QUANTITY: "df_quantity", ITEM_DISCOUNT: "df_discount", ITEM_CATEGORY1: "df_category1", ITEM_CATEGORY2: "df_category2", ITEM_CATEGORY3: "df_category3", ITEM_CATEGORY4: "df_category4", ITEM_CATEGORY5: "df_category5", DISCOUNT: "df_discount", TOTAL_REFUND_AMOUNT: "df_total_refund_amount", ORDER_ID: "df_order_id", DELIVERY_CHARGE: "df_delivery_charge", PAYMENT_METHOD: "df_payment_method", TOTAL_PURCHASE_AMOUNT: "df_total_purchase_amount", SHARING_CHANNEL: "df_sharing_channel", SIGN_CHANNEL: "df_sign_channel", KEYWORD: "df_keyword" };
        _.DFGender = { MALE: "Male", FEMALE: "Female", NON_BINARY: "NonBinary", OTHER: "Other" };
        _.DFIdentity = { EXTERNAL_ID: "external_id", EMAIL: "email", PHONE_NO: "phone_no", KAKAO_USER_ID: "kakao_user_id", LINE_USER_ID: "line_user_id", UNIFIED_ID: "unified_id" };
        _.DFUserProfile = { BIRTH: "df_birth", GENDER: "df_gender", NAME: "df_name", MEMBERSHIP: "df_membership", PUSH_OPTIN: "df_push_optin", PUSH_ADS_OPTIN: "df_push_ads_optin", PUSH_NIGHT_ADS_OPTIN: "df_push_night_ads_optin", SMS_ADS_OPTIN: "df_sms_ads_optin", KAKAO_ADS_OPTIN: "df_kakao_ads_optin" };
        _.DFConfig = { LOG_ENABLE: "logEnable", LOG_LEVEL: "logLevel", SHARE_SUBDOMAIN_COOKIE: "shareSubdomainCookie" };
        _.DFLogLevel = { DISABLE: 0, ERROR: 1, WARN: 2, INFO: 3 };
        _.Dfinery = dfinery;
      }(window, document));
    </script>
  </head>
  <body data-route="product" data-default-sdk="latest">
    <div id="app"></div>
    <script src="./legacy-mpa.js"></script>
  </body>
</html>
